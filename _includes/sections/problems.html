<problem-comparison before="Today" after="With the Action API">
  {%- for problem in site.data.problems %}
  <problem-item heading="{{ problem.title | escape }}" label="With the Action API">
    <span slot="before">{% include inline.html text=problem.today %}</span>
    <span slot="after">{% include inline.html text=problem.solution %}</span>
  </problem-item>
  {%- endfor %}
</problem-comparison>
