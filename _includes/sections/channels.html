{%- for channel in site.data.channels %}
<channel-entry id="channel-{{ channel.id }}" heading="{{ channel.label | escape }}">
  <span slot="intro">{% include inline.html text=channel.intro %}</span>
  {%- for snippet in channel.snippets %}
  {% include code.html snippet=snippet %}
  {%- endfor %}
</channel-entry>
{%- endfor %}
