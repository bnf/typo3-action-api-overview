title: The TYPO3 Action API
description: >-
  A typed API for the TYPO3 backend, external integrations and AI agents.

# Comments on GitHub, see assets/js/components/github-comments.js
comments:
  repository: bnf/typo3-action-api-overview

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - serve.sh
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - scripts/
  - schemas/
  - _build.yml
  - vendor/
