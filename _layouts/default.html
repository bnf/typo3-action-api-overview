<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Apply a fixed colour scheme before rendering, see assets/js/components/color-scheme-toggle.js
    try {
      const scheme = localStorage.getItem('color-scheme');
      if (scheme === 'light' || scheme === 'dark') {
        document.documentElement.dataset.colorScheme = scheme;
      }
    } catch {}
  </script>
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description | strip }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header class="topbar">
    <button class="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <a class="brand" href="#top">{{ site.title }}</a>
    <span class="spacer"></span>
    <color-scheme-toggle></color-scheme-toggle>
    {%- assign epic = site.data.issues.issues | where: "number", site.data.issues.source.epic | first %}
    <a class="pill-link" href="{{ epic.url }}">Epic #{{ epic.number }}</a>
  </header>
  <div class="layout" id="top">
    <nav class="sidebar" aria-label="Contents">
      <p class="label">Contents</p>
      <ol></ol>
    </nav>
    <main class="content">
      {{ content }}
      <footer>
        TYPO3 Action API · Epic <a href="{{ epic.url }}">#{{ epic.number }}</a> on forge.typo3.org · Content from <code>_data/</code>
      </footer>
    </main>
  </div>

  <zoom-viewer></zoom-viewer>

  <script type="importmap">{ "imports": { "lit": "{{ '/assets/vendor/lit-core.min.js' | relative_url }}" } }</script>
  <script type="module" src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
