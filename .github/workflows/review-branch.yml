name: Review branch

# Updates the branch of the review pull request after every change on main,
# see scripts/update-review-branch.sh.

on:
  push:
    branches: [main]
    paths: ['_data/**']

permissions:
  contents: write

concurrency: review-branch

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update review-head
        run: scripts/update-review-branch.sh
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
